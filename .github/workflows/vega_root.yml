name: VEGA Merkle Root Commit (Sun 17:20 UTC)

on:
  schedule:
    - cron: '20 17 * * 0'   # Every Sunday 17:20 UTC = pre-declared cutoff
  workflow_dispatch:
    inputs:
      date:
        description: 'Root date (YYYY-MM-DD)'
        required: false
        default: '2026-09-20'

concurrency:
  group: vega-root
  cancel-in-progress: false

jobs:
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need full tape history

      - name: Restore all tape files
        run: |
          git fetch --all
          ls tape/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Commit Merkle root
        run: |
          DATE=${{ github.event.inputs.date || '2026-09-20' }}
          python verification/vega_root.py root --date $DATE

      - name: Push root manifest
        run: |
          git config user.name "VEGA-Bot"
          git config user.email "vega-bot@github-actions"
          git add -f verification/root_*.json
          if git diff --cached --quiet; then
            echo "Root already committed"
          else
            git commit -m "vega_root: Merkle commitment 2026-09-18T04:16:58Z"
            git push
          fi
