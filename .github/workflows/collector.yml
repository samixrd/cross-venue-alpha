name: VEGA Tape Collector (24/7 Cloud)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: vega-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Show chain state
        run: ls tape/ | grep chain || echo "No chain state yet (GENESIS run)"

      - name: Sample once from all 3 venues
        run: python tape/collector.py --now
        env:
          PYTHONUNBUFFERED: '1'

      - name: Commit and push new tape data
        run: |
          git config user.name  "VEGA-Bot"
          git config user.email "vega-bot@github-actions"
          git add -f tape/*.jsonl tape/_chain_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            IS_WE=$(python -c "import datetime; n=datetime.datetime.now(datetime.UTC); wd=n.weekday(); h=n.hour; print('WEEKEND' if (wd==4) or (wd in (5,6)) or (wd==0 and h<=21) else 'WEEKDAY')")
            git commit -m "tape: ${TIMESTAMP} [${IS_WE}]"
            git push
          fi